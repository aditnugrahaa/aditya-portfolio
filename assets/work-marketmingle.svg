    <rect x="170" y="152" width="94" height="8" rx="4" fill="#94A3B8"/>
    <rect x="170" y="198" width="72" height="24" rx="12" fill="#0F172A"/>

    <!-- Card 2 -->
    <rect x="346" y="110" width="298" height="134" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="362" y="126" width="110" height="102" rx="10" fill="#DBEAFE"/>
    <rect x="394" y="154" width="46" height="46" rx="12" fill="#2563EB"/>
    <rect x="488" y="132" width="120" height="12" rx="6" fill="#0F172A"/>
    <rect x="488" y="152" width="94" height="8" rx="4" fill="#94A3B8"/>
