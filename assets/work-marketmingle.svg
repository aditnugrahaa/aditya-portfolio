    <polygon points="99,296 124,344 74,344" fill="#059669"/>
    <rect x="170" y="278" width="120" height="12" rx="6" fill="#0F172A"/>
    <rect x="170" y="298" width="94" height="8" rx="4" fill="#94A3B8"/>
