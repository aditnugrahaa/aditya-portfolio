<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="slateBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="monShadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#slateBg)"/>

  <!-- Floating Marketplace Web Workspace -->
  <g filter="url(#monShadow)" transform="translate(64, 44)">
    <rect width="672" height="412" rx="20" fill="#0F172A"/>
    <rect x="10" y="10" width="652" height="392" rx="14" fill="#FFFFFF"/>

