<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDEAE2"/>
      <stop offset="100%" stop-color="#DFDBD0"/>
    </linearGradient>
    <linearGradient id="orangeArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF3A2D"/>
      <stop offset="100%" stop-color="#C81E14"/>
    </linearGradient>
    <linearGradient id="cobaltCircle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2340E8"/>
      <stop offset="100%" stop-color="#1528A6"/>
    </linearGradient>
    <filter id="frameShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="14" dy="22" stdDeviation="18" flood-color="#121318" flood-opacity="0.22"/>
    </filter>
    <pattern id="microGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#121318" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Warm architectural gallery backdrop -->
  <rect width="800" height="600" fill="url(#bgWall)"/>
  <!-- Diagonal gallery sunlight cast -->
  <polygon points="0,0 520,0 240,600 0,600" fill="#FFFFFF" opacity="0.32"/>

  <!-- Mounted dark exhibition frame -->
  <g filter="url(#frameShadow)">
    <rect x="170" y="54" width="460" height="492" rx="10" fill="#14151B"/>
    <!-- Poster paper sheet -->
    <rect x="192" y="76" width="416" height="448" rx="4" fill="#F8F6F1"/>
    <rect x="192" y="76" width="416" height="448" rx="4" fill="url(#microGrid)"/>

    <!-- Poster Header Grid -->
    <line x1="216" y1="114" x2="584" y2="114" stroke="#121318" stroke-width="1.5"/>
    <text x="216" y="104" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#121318" letter-spacing="2">VISUAL DIRECTION · 01</text>
    <text x="584" y="104" text-anchor="end" font-family="'Space Mono', monospace" font-size="11" fill="#575B66">SWISS GRID</text>

    <!-- Bold Geometric Bauhaus Composition -->
    <g transform="translate(216, 134)">
      <!-- Cobalt quarter disk -->
      <path d="M 0 230 A 230 230 0 0 1 230 0 L 230 230 Z" fill="url(#cobaltCircle)" opacity="0.92"/>
      <!-- Orange sculptural arch -->
      <path d="M 138 230 L 138 92 A 92 92 0 0 1 322 92 L 322 230 Z" fill="url(#orangeArch)"/>
      <!-- Ink black precision circle -->
      <circle cx="290" cy="70" r="46" fill="#121318"/>
      <!-- Cream cutout core -->
      <circle cx="230" cy="148" r="34" fill="#F8F6F1"/>

      <!-- Vector Bezier construction spline & anchors -->
      <path d="M 18 212 C 90 40, 240 190, 350 28" fill="none" stroke="#121318" stroke-width="2.2" stroke-dasharray="5 5"/>
      <rect x="12" y="206" width="12" height="12" fill="#F8F6F1" stroke="#121318" stroke-width="2.2"/>
      <rect x="344" y="22" width="12" height="12" fill="#F8F6F1" stroke="#121318" stroke-width="2.2"/>
      <circle cx="90" cy="40" r="6" fill="#EF3A2D" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="240" cy="190" r="6" fill="#EF3A2D" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Expressive Poster Typography -->
    <text x="216" y="424" font-family="Arial Black, sans-serif" font-size="46" font-weight="900" fill="#121318" letter-spacing="-2">FORM &amp;</text>
    <text x="216" y="468" font-family="Arial Black, sans-serif" font-size="46" font-weight="900" fill="#EF3A2D" letter-spacing="-2">CONTRAST</text>

    <!-- Bottom Swiss metadata spec bar -->
    <line x1="216" y1="488" x2="584" y2="488" stroke="#121318" stroke-opacity="0.25" stroke-width="1"/>
    <text x="216" y="508" font-family="monospace" font-size="10" fill="#575B66">TYPE · COLOR · HIERARCHY</text>
    <circle cx="560" cy="504" r="5" fill="#EF3A2D"/>
    <circle cx="574" cy="504" r="5" fill="#121318"/>
  </g>
</svg>
