<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="amberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="tabShadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#78350F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#amberBg)"/>

  <!-- Floating Tablet Recruitment Kanban Mockup -->
  <g filter="url(#tabShadow)" transform="translate(72, 46)">
    <rect width="656" height="408" rx="26" fill="#18181B"/>
    <rect x="14" y="14" width="628" height="380" rx="16" fill="#F8FAFC"/>

    <!-- Top Kanban Header -->
    <rect x="14" y="14" width="628" height="54" rx="16" fill="#FFFFFF"/>
    <rect x="34" y="32" width="124" height="16" rx="8" fill="#18181B"/>
    <rect x="524" y="29" width="96" height="24" rx="12" fill="#F59E0B"/>

    <!-- 3 Kanban Columns -->
    <!-- Col 1: Screening -->
    <rect x="32" y="84" width="190" height="292" rx="12" fill="#F1F5F9"/>
    <rect x="46" y="100" width="82" height="10" rx="5" fill="#475569"/>
    <rect x="44" y="124" width="166" height="72" rx="10" fill="#FFFFFF"/>
    <circle cx="68" cy="150" r="14" fill="#FDE68A"/>
    <rect x="92" y="140" width="84" height="9" rx="4.5" fill="#18181B"/>
    <rect x="92" y="156" width="54" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="44" y="206" width="166" height="72" rx="10" fill="#FFFFFF"/>
    <circle cx="68" cy="232" r="14" fill="#FED7AA"/>
    <rect x="92" y="222" width="76" height="9" rx="4.5" fill="#18181B"/>
    <rect x="92" y="238" width="62" height="7" rx="3.5" fill="#94A3B8"/>

    <!-- Col 2: Interview -->
    <rect x="234" y="84" width="190" height="292" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="248" y="100" width="86" height="10" rx="5" fill="#B45309"/>
    <rect x="246" y="124" width="166" height="82" rx="10" fill="#FFFFFF"/>
    <circle cx="270" cy="152" r="14" fill="#F59E0B"/>
    <rect x="294" y="142" width="90" height="9" rx="4.5" fill="#18181B"/>
    <rect x="294" y="158" width="64" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="260" y="182" width="64" height="12" rx="6" fill="#FEF3C7"/>
    <rect x="246" y="218" width="166" height="72" rx="10" fill="#FFFFFF"/>
    <circle cx="270" cy="244" r="14" fill="#18181B"/>
    <rect x="294" y="234" width="82" height="9" rx="4.5" fill="#18181B"/>
    <rect x="294" y="250" width="56" height="7" rx="3.5" fill="#94A3B8"/>

    <!-- Col 3: Final Offer -->
    <rect x="436" y="84" width="190" height="292" rx="12" fill="#F1F5F9"/>
    <rect x="450" y="100" width="74" height="10" rx="5" fill="#475569"/>
    <rect x="448" y="124" width="166" height="86" rx="10" fill="#18181B"/>
    <circle cx="472" cy="152" r="14" fill="#FBBF24"/>
    <rect x="496" y="142" width="88" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="496" y="158" width="54" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="462" y="182" width="136" height="14" rx="7" fill="#F59E0B"/>
  </g>
</svg>
