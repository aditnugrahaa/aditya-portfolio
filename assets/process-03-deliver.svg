<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="darkStudio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1C24"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="motionGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2340E8"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glowCard" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crisp Cream Mount with Dark Screen Showcase -->
  <rect width="600" height="750" fill="#F2EFE8"/>
  <circle cx="480" cy="120" r="140" fill="#2340E8" opacity="0.14"/>

  <g filter="url(#glowCard)" transform="translate(46, 70)">
    <rect width="508" height="610" rx="28" fill="url(#darkStudio)"/>

    <!-- Top Spec Header -->
    <text x="34" y="54" font-family="monospace" font-size="13" font-weight="700" fill="#2340E8">STEP 03 / CRAFT &amp; MOTION</text>
    <circle cx="456" cy="48" r="7" fill="#22C55E"/>

    <!-- Preview Stage Box Inside Display -->
    <rect x="34" y="80" width="440" height="236" rx="18" fill="#1F222D" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <!-- Concentric 3D ring + diamond gem preview -->
    <ellipse cx="254" cy="198" rx="108" ry="44" fill="none" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="4" transform="rotate(-18 254 198)"/>
    <ellipse cx="254" cy="198" rx="98" ry="40" fill="none" stroke="url(#motionGlow)" stroke-width="4" transform="rotate(24 254 198)"/>
    <polygon points="254,132 298,198 254,264 210,198" fill="#2340E8"/>
    <polygon points="254,132 298,198 254,205" fill="#7D8EF0"/>

    <!-- Cubic-Bezier Easing Curve Card -->
    <rect x="34" y="338" width="212" height="122" rx="14" fill="#181A22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M 60 434 C 110 434, 130 364, 218 364" fill="none" stroke="url(#motionGlow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="434" r="5" fill="#FFFFFF"/>
    <circle cx="218" cy="364" r="5" fill="#2340E8"/>

    <!-- Export Format Badges Card -->
    <rect x="262" y="338" width="212" height="122" rx="14" fill="#181A22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="282" y="360" width="80" height="28" rx="14" fill="#2340E8"/>
    <text x="322" y="378" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">FINAL</text>
    <rect x="372" y="360" width="80" height="28" rx="14" fill="#272A36"/>
    <text x="412" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#CBD5E1">60 FPS</text>
    <rect x="282" y="402" width="170" height="10" rx="5" fill="#334155"/>
    <rect x="282" y="422" width="122" height="10" rx="5" fill="#475569"/>

    <!-- Motion Timeline Tracks & Diamond Keyframes -->
    <rect x="34" y="478" width="440" height="98" rx="14" fill="#14161D" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <line x1="254" y1="478" x2="254" y2="576" stroke="#2340E8" stroke-width="2"/>
    <rect x="54" y="502" width="400" height="12" rx="6" fill="#232634"/>
    <rect x="110" y="502" width="180" height="12" rx="6" fill="#2340E8"/>
    <rect x="54" y="534" width="400" height="12" rx="6" fill="#232634"/>
    <rect x="160" y="534" width="220" height="12" rx="6" fill="#60A5FA"/>
    <!-- Diamond keyframes -->
    <polygon points="110,500 118,508 110,516 102,508" fill="#FFFFFF"/>
    <polygon points="290,500 298,508 290,516 282,508" fill="#FFFFFF"/>
    <polygon points="160,532 168,540 160,548 152,540" fill="#FCD34D"/>
    <polygon points="380,532 388,540 380,548 372,540" fill="#FCD34D"/>
  </g>
</svg>
